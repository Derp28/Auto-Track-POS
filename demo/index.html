<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#16212b">
    <meta name="description" content="Auto-Track POS interactive demo: checkout, inventory, purchasing, returns, and daily controls running on sample data in your browser.">
    <meta name="robots" content="noindex">
    <title>Auto-Track POS — Interactive demo</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/app.css">
    <link rel="stylesheet" href="./demo/demo.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="prototype-banner" id="connection-banner" role="status" aria-live="polite">
      Loading the demo shop…
    </div>
    <div class="app-shell" id="app">
      <aside class="sidebar" id="app-sidebar" aria-label="Primary navigation"></aside>
      <div class="app-frame">
        <header class="topbar" id="app-topbar"></header>
        <main class="main-content" id="main-content" tabindex="-1"></main>
        <footer class="app-footer">
          <span>Auto-Track · Auto Supply &amp; Service POS · interactive demo</span>
          <span>Sample data in your browser · nothing is saved · no database</span>
        </footer>
      </div>
    </div>
    <button class="mobile-scrim" type="button" data-nav-toggle aria-label="Close navigation" tabindex="-1"></button>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>
    <dialog class="modal" id="app-dialog"></dialog>
    <noscript>
      <div class="noscript">The Auto-Track demo needs JavaScript enabled.</div>
    </noscript>
    <script type="module" src="./demo/boot.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
